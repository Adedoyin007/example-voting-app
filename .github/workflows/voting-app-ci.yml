name: Voting App CI - Build, Scan and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for app in vote result worker; do
            docker build --pull \
              -t "$DOCKERHUB_USERNAME/example-voting-app-$app:$GITHUB_SHA" \
              "./$app"
          done

      - name: Scan images with Trivy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for app in vote result worker; do
            echo "Scanning $app image..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.69.1 \
              image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 0 \
              "$DOCKERHUB_USERNAME/example-voting-app-$app:$GITHUB_SHA"
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for app in vote result worker; do
            docker push \
              "$DOCKERHUB_USERNAME/example-voting-app-$app:$GITHUB_SHA"
          done
